name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # otomatis setiap 12 jam (UTC)
  workflow_dispatch:          # tombol "Run workflow" untuk menjalankan manual
  push:
    branches:
      - main                  # ganti ke "master" jika branch default repo kamu master

permissions:
  contents: write             # dibutuhkan untuk push SVG ke branch "output"

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1) Buat SVG snake: versi terang + versi gelap (warna neon cyan/violet)
      - name: Generate snake SVG (light & dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#C4B5FD,#A78BFA,#7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#161B22,#3B1D6E,#6D28D9,#A855F7,#00F5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2) Publikasikan hasilnya ke branch "output"
      - name: Push SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
